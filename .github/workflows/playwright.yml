name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 06:00 UTC (03:00 America/Sao_Paulo) - roda a suite completa toda noite
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Qual suite rodar'
        required: true
        default: 'regression'
        type: choice
        options:
          - regression
          - full

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps

      - name: Rodar suite de regressao (push / pull_request)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm run test:regression
        env:
          CI: true
          # PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          # Credenciais de login, se os testes precisarem autenticar:
          # QA_LOGIN_USER: ${{ secrets.QA_LOGIN_USER }}
          # QA_LOGIN_PASSWORD: ${{ secrets.QA_LOGIN_PASSWORD }}

      - name: Rodar suite completa (agendado / manual)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
        run: npm test
        env:
          CI: true

      - name: Rodar suite de regressao (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'regression'
        run: npm run test:regression
        env:
          CI: true

      - name: Publicar relatorio HTML como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Guarda o relatorio para o job de deploy no GitHub Pages (so nos gatilhos
      # que nao sao pull_request - PR de fork nao tem permissao de publicar Pages).
      - name: Preparar artefato para o GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy-report:
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
